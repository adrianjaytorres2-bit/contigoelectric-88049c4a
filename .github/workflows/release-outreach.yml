name: Release Outreach app (auto-update feed)

# Triggered by pushing a version tag (e.g. v0.2.0). Builds the Windows
# installer/portable exe and publishes them as a GitHub Release, along with
# the latest.yml metadata file electron-updater reads to detect new
# versions. Regular branch pushes still use build-outreach-exe.yml for quick
# test artifacts and do NOT publish a release or trigger auto-update.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: outreach
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build and publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
